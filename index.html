<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f6f7f8;--cf:#d9dce0;--dl:#9aa0a6;--bd:#cfd4d9;--ac:#1565c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eceff1;--cf:#3a3f44;--dl:#7b8187;--card:#1b1e21;--bd:#3a3f44;--ac:#64b5f6}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#eceff1;--cf:#3a3f44;--dl:#7b8187;--card:#1b1e21;--bd:#3a3f44;--ac:#64b5f6}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#top{position:relative;z-index:20;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--bd)}
#tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
#tabs button,#row button{flex:0 0 auto;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:14px;padding:10px 16px;font-size:15px}
#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#rf,#cg,#rf2,#cg2{display:none!important}#hb,#barS #hb2{font-size:15px!important;padding:0!important}
#bar1{display:flex;gap:6px}#hb,#hb2{flex:0 0 auto;width:48px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:8px;font-size:24px;line-height:1}
#row{display:none;flex-wrap:wrap;gap:6px;position:absolute;left:0;right:0;top:100%;background:var(--card);padding:8px;border-bottom:1px solid var(--bd);box-shadow:0 8px 14px rgba(0,0,0,.3)}#row.open{display:none!important}
#mailp{position:fixed;inset:0;z-index:150;background:var(--card);color:var(--fg);overflow:auto;display:none;padding:12px 14px calc(30px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#mailp .mw{max-width:560px;margin:0 auto}#mailp h4{margin:0 0 4px;font-size:18px;display:flex;align-items:center}#mailp h4 button{margin-left:auto;border:0;background:none;font-size:26px;color:var(--fg);line-height:1}
#mailp .ml{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6b7280;margin:12px 0 3px}
#mailp input,#mailp textarea{width:100%;box-sizing:border-box;padding:9px 10px;font:14px/1.4 inherit;border:1px solid #cfd4d9;border-radius:9px;background:#fff;color:#000}
#mailp textarea{resize:vertical}#mailp .two{display:flex;gap:8px}#mailp .two>div{flex:1}
#mailp .ch{display:inline-flex;align-items:center;gap:6px;margin:3px 4px 0 0;padding:4px 6px 4px 11px;border-radius:999px;background:#e3f0ff;color:#0d47a1;font-size:13px;font-weight:600}#mailp .ch b{cursor:pointer;font-size:16px;padding:0 3px}
#mailp .sg{border:1px solid #cfd4d9;border-radius:9px;margin-top:3px;background:#fff;color:#000;overflow:hidden}#mailp .sg div{padding:9px 11px;font-size:14px;border-bottom:1px solid #eee;cursor:pointer}#mailp .sg div:hover{background:#eaf3ff}
#mailp a.go{display:block;margin-top:14px;padding:14px;border-radius:999px;background:#1565c0;color:#fff;text-align:center;font-weight:700;font-size:16px;text-decoration:none}#mailp a.go.sm{flex:1;margin-top:0;padding:10px;font-size:14px;background:#455a64}#mailp a.go.off{background:#b8c4d2;pointer-events:none}
#mailp .tl{border:0;background:none;color:#1565c0;font-weight:600;font-size:13px;padding:4px 2px;cursor:pointer}#mailp .hint{font-size:12px;color:#6b7280;margin:4px 0}
#mailp .two3{display:flex;gap:6px}#mailp .two3>div{flex:1;min-width:0}#mailp .two3 input{padding:7px 6px;font-size:13px}#mailp .stk{position:sticky;bottom:0;z-index:2;background:var(--card);padding:8px 0 4px}#mailp .stk{display:flex;gap:8px}#mailp .stk .go{margin-top:0;flex:1;padding:13px 6px}#mailp .stk #mOl{background:#0b5cad}
#mailp .pk{position:relative}#mailp .pk>input:not(.hid){padding-right:30px}#mailp .pb{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:16px;padding:4px;cursor:pointer}#mailp .hid{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;padding:0;border:0}
#mailp textarea.pvw{min-height:200px;max-height:none;resize:vertical;font-family:inherit}
#mailp .pvw{white-space:pre-wrap;font-size:12.5px;line-height:1.4;border:1px dashed #9db8d9;background:#f3f8ff;color:#223;border-radius:9px;padding:8px 10px;max-height:140px;overflow:auto}
#mailp details{border-top:1px solid #e1e5ea;margin-top:8px;padding-top:6px}#mailp summary{cursor:pointer;font-weight:600;color:#1565c0;font-size:14px;padding:4px 0}#mailp .fixl{font-size:13px;color:#334;overflow-wrap:anywhere}
#mailp .mk{display:flex;align-items:center;padding:14px 4px;font-size:17px;font-weight:600;color:#1565c0;border-bottom:1px solid #e8ebef;cursor:pointer}#mailp .mk em{margin-left:auto;font-style:normal;color:#9aa0a6}#mailp .mk:active{background:#e3f0ff}
.bs{display:flex;gap:2px;margin-top:10px}#sheet .bs .b{margin:0;flex:1}#sheet .bs .b:first-child{border-radius:8px 0 0 8px}#sheet .bs .b:last-child{border-radius:0 8px 8px 0}#sheet .bs button.b{cursor:pointer}
.sxs{display:inline-flex;gap:2px}.sxs>*{margin:0!important}.sxs>*:first-child{border-radius:8px 0 0 8px!important}.sxs>*:last-child{border-radius:0 8px 8px 0!important}.sxs button.sx{border:0;font:inherit;cursor:pointer}
#drwb{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}#drwb.on{display:block}
#drw{position:fixed;left:0;top:0;bottom:0;width:272px;max-width:82vw;background:var(--card);color:var(--fg);z-index:201;padding:16px 0;box-shadow:4px 0 18px rgba(0,0,0,.35);transform:translateX(-105%);transition:transform .2s ease-out;overflow-y:auto}#drw.on{transform:none}
#drw .dh{padding:0 18px 10px;border-bottom:1px solid var(--bd);margin-bottom:6px}#drw .dh b{font-size:18px}#drw .dh div{font-size:12px;opacity:.65}
#drw .dt{display:flex;align-items:center;gap:14px;padding:13px 18px;font-size:16px;color:var(--ac);font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}#drw .dt:hover,#drw .dt:active{background:rgba(21,101,192,.12)}

const XLMES={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,setiembre:8,septiembre:8,octubre:9,noviembre:10,diciembre:11};
const XLNAMES={pablo:"Pablo Miraldo",ivan:"Iván Perez",nahuel:"Nahuel Ipuche",renzo:"Renzo"};
const xlName=v=>{const t=String(v||"").trim();if(t.length<2)return "";return XLNAMES[nz(t)]||(t.charAt(0).toUpperCase()+t.slice(1))};
async function xInflate(u8){const ds=new DecompressionStream("deflate-raw");return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer())}
async function xUnzip(ab){const dv=new DataView(ab),u8=new Uint8Array(ab);let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error("No es un archivo .xlsx");
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const F={};
 for(let i=0;i<n;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  const nm=new TextDecoder().decode(u8.subarray(p+46,p+46+nl)),lh=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),d=u8.subarray(lh,lh+cs);
  F[nm]=async()=>new TextDecoder().decode(m===0?d:await xInflate(d));p+=46+nl+xl+cl}
 return F}
async function xlParse(ab){const z=await xUnzip(ab),out={};
 const un=t=>t.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n)).replace(/&amp;/g,"&");
 const ss=[];if(z["xl/sharedStrings.xml"]){for(const m of (await z["xl/sharedStrings.xml"]()).matchAll(/<si>([\s\S]*?)<\/si>/g)){let t="";for(const x of m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g))t+=x[1];ss.push(un(t))}}
 const wb=await z["xl/workbook.xml"](),rels=await z["xl/_rels/workbook.xml.rels"](),tg={};
 for(const m of rels.matchAll(/<Relationship\b([^>]*)\/?>/g)){const id=/Id="([^"]*)"/.exec(m[1]),t=/Target="([^"]*)"/.exec(m[1]);if(id&&t)tg[id[1]]=t[1].replace(/^\/?(xl\/)?/,"xl/")}
 const colN=r=>{let c=0;for(const ch of r)c=c*26+ch.charCodeAt(0)-64;return c-1};
 for(const m of wb.matchAll(/<sheet\b([^>]*)\/?>/g)){const nm=/name="([^"]*)"/.exec(m[1]),rid=/r:id="([^"]*)"/.exec(m[1]);if(!nm||!rid||!tg[rid[1]]||!z[tg[rid[1]]])continue;
  const xml=await z[tg[rid[1]]](),rows=[];
  for(const r of xml.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)){const row=[];
   for(const c of r[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){const ref=/r="([A-Z]+)\d+"/.exec(c[1]);if(!ref||c[2]==null)continue;const t=/t="([^"]*)"/.exec(c[1]),v=/<v>([\s\S]*?)<\/v>/.exec(c[2]);let val=null;
    if(t&&t[1]=="inlineStr"){let q="";for(const x of c[2].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g))q+=x[1];val=un(q)}else if(v)val=t&&t[1]=="s"?ss[+v[1]]:un(v[1]);
    row[colN(ref[1])]=val}
   rows.push(row)}
  const hi=rows.findIndex(r=>r.some(x=>nz(x).trim()=="sitio actual"));if(hi<0)continue;
  const H=rows[hi].map(x=>nz(x).trim()),ci=H.indexOf("sitio actual"),ct=H.indexOf("tecnico");if(ct<0)continue;
  const mes=XLMES[nz(un(nm[1])).trim()];if(mes===undefined)continue;
  out[mes]=rows.slice(hi+1).map(r=>({n:String(r[ci]||"").trim(),t:xlName(r[ct])})).filter(x=>x.n&&x.t)}
 return out}
